<main>
    <section class="panel">
        <div class="section-heading">
            <h2>Your Notes</h2>
            <button id="load-btn" type="button">Load notes</button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite">
            Click Load notes to begin.
        </p>

        <ul id="notes-list"></ul>
    </section>

    <section class="panel">
        <h2>Create a Note</h2>

        <form id="note-form">
            <label for="title-input">Title (required, maximum 100 characters)</label>
            <input
                id="title-input"
                name="title"
                type="text"
                maxlength="100"
                required
            >

            <label for="body-input">Note Body (optional)</label>
            <textarea
                id="body-input"
                name="body"
                rows="5"
            ></textarea>

            <button id="submit-btn" type="submit">Create note</button>
        </form>
    </section>
</main>

<footer>
    <p>QuickNotes System Design Project</p>
</footer>
